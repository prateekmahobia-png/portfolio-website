<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      text-align: center;
      padding: 40px 15px;
    }
    .card {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #ccd;
    }
    h1 { color: #243b80; }
    p { color: #444; line-height: 1.7; }
    a {
      display: inline-block;
      background: #243b80;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Portfolio</h1>
    <h2>Front-End Development</h2>
    <p>Hello! I am a Computer Science graduate
    interested in web design and technology.</p>
    <p>My skills: HTML, CSS and web design.</p>
    <a href="mailto:your-email@example.com">Contact Me</a>
  </div>
</body>
</html>
